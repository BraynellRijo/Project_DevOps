<!DOCTYPE html>
<html lang="es">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola Mundo</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f4f4f5; 
            color: #1a1a1a;
            font-family: system-ui, -apple-system, sans-serif;
        }
        
        .container {
            background-color: #ffffff;
            padding: 3rem 4rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            text-align: center;
        }
        
        /* Título principal */
        h1 {
            margin: 0;
            font-weight: 400;
            font-size: 2.5rem;
            letter-spacing: 1px;
        }

        h3 {
            margin: 0.5rem 0 0 0;
            font-weight: 300;
            font-size: 1.1rem;
            color: #666666; 
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Hola Mundo</h1>
        <h3>By Braynell Rijo</h3>
    </div>

</body>
</html>
